<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you — Outlet en Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Poppins',sans-serif;
    background:#eceae2; color:#1b1b2b;
    min-height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding:40px 20px;
  }
  .mark{ font-family:'Dancing Script',cursive; font-size:64px; color:#0c0c0c; line-height:1; }
  .sub{ font-weight:600; font-size:11px; letter-spacing:6px; margin:-4px 0 40px 36px; }
  .sub .dot{ color:#ff4500; }
  .check{
    width:84px; height:84px; border-radius:50%;
    background:#2e7d32; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:44px; margin-bottom:24px;
  }
  h1{ font-size:28px; font-weight:800; margin-bottom:12px; }
  p{ font-size:16px; color:#555; max-width:460px; line-height:1.5; margin-bottom:28px; }
  .btns{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  a.btn{
    text-decoration:none; padding:16px 28px; border-radius:12px;
    font-weight:700; font-size:14px; letter-spacing:.5px;
  }
  a.btn.dark{ background:#0c0c0c; color:#fff; }
  a.btn.light{ background:#fff; color:#1b1b2b; box-shadow:0 2px 10px rgba(0,0,0,.06); }
</style>
</head>
<body>
  <span class="mark">Outlet</span>
  <span class="sub">EN&nbsp;LIVE<span class="dot">.</span></span>
  <div class="check">&#10003;</div>
  <h1>Thank you for your order!</h1>
  <p>Your order has been successfully recorded. Our customer service will get back to you from Monday to Friday, 9 AM to 5 PM.</p>
  <div class="btns">
    <a class="btn dark" href="track.html">Track my order</a>
    <a class="btn light" href="/">Back to home</a>
  </div>
</body>
</html>
