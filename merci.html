<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci — Outlet en Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Poppins',sans-serif;
    background:#eceae2;
    color:#1b1b2b;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
  }
  .mark{
    font-family:'Dancing Script',cursive;
    font-size:64px;
    color:#0c0c0c;
    line-height:1;
  }
  .sub{
    font-weight:600;font-size:11px;letter-spacing:6px;margin:-4px 0 40px 36px;
  }
  .sub .dot{color:#ff4500;}
  .check{
    width:84px;height:84px;border-radius:50%;
    background:#2e7d32;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:44px;margin-bottom:24px;
  }
  h1{font-size:28px;font-weight:800;margin-bottom:12px;}
  p{font-size:16px;color:#555;max-width:440px;line-height:1.5;margin-bottom:28px;}
  a.btn{
    background:#0c0c0c;color:#fff;text-decoration:none;
    padding:16px 30px;border-radius:12px;font-weight:700;font-size:14px;
    letter-spacing:.5px;
  }
</style>
</head>
<body>
  <span class="mark">Outlet</span>
  <span class="sub">EN&nbsp;LIVE<span class="dot">.</span></span>
  <div class="check">&#10003;</div>
  <h1>Merci !</h1>
  <p>Votre commande a bien été enregistrée. Notre service membre vous recontactera du lundi au vendredi, de 9h à 17h.</p>
  <a class="btn" href="/">Retour à l'accueil</a>
</body>
</html>
