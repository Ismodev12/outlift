<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track your orders — Outlet en Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{ --bg:#eceae2; --text:#1b1b2b; --brown:#96835e; }
  body{ font-family:'Poppins',sans-serif; background:#fff; color:var(--text); min-height:100vh; }

  /* ---------- Header band ---------- */
  .topbar{
    background:var(--bg); padding:26px 40px;
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .topbar img{ width:170px; max-width:46vw; height:auto; display:block; }
  .return-btn{
    position:absolute; right:40px; top:50%; transform:translateY(-50%);
    background:#0c0c0c; color:#fff; text-decoration:none;
    padding:13px 26px; border-radius:12px; font-weight:700;
    font-size:13px; letter-spacing:.5px;
  }
  .return-btn:hover{ background:#232323; }

  /* ---------- Content ---------- */
  .wrap{ max-width:1180px; margin:0 auto; padding:56px 20px 80px; }
  h1{ text-align:center; font-size:30px; font-weight:800; margin-bottom:26px; }
  .note{ color:var(--brown); font-size:15px; margin-bottom:28px; }

  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:separate; border-spacing:0; font-size:15px; }
  thead th{
    background:#0c0c0c; color:#fff; text-align:left; font-weight:700;
    padding:18px 24px; font-size:15px;
  }
  thead th:first-child{ border-top-left-radius:10px; border-bottom-left-radius:10px; }
  thead th:last-child{ border-top-right-radius:10px; border-bottom-right-radius:10px; text-align:center; }
  tbody td{ padding:22px 24px; border-bottom:1px solid #eee; color:#333; }
  tbody td:first-child{ font-weight:700; color:#1b1b2b; }
  tbody td.carrier{ color:var(--brown); }
  tbody td.status{ text-align:center; }
  .badge{
    display:inline-block; background:#d9f2df; color:#2e7d32;
    font-weight:700; font-size:13px; padding:6px 16px; border-radius:20px;
  }
  .empty{ text-align:center; color:#999; padding:50px 20px; font-size:15px; }

  @media (max-width:640px){
    .topbar{ padding:22px 20px; }
    .return-btn{ right:20px; padding:11px 18px; }
    h1{ font-size:24px; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <img src="logo.png" alt="Outlet en Live">
    <a class="return-btn" href="/">RETURN</a>
  </div>

  <div class="wrap">
    <h1>YOUR ORDERS</h1>
    <p class="note">* Only orders placed from your current device are displayed here.</p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Reference</th>
            <th>Date</th>
            <th>Total price</th>
            <th>Carrier</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="empty" id="empty" style="display:none;">You have not placed any orders from this device yet.</p>
  </div>

<script>
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  var orders = [];
  try{ orders = JSON.parse(localStorage.getItem('outlet_orders') || '[]'); }catch(e){ orders = []; }

  var rows = document.getElementById('rows');
  var empty = document.getElementById('empty');

  if(!orders.length){
    document.querySelector('.table-wrap').style.display = 'none';
    empty.style.display = 'block';
  } else {
    rows.innerHTML = orders.map(function(o){
      return '<tr>'
        + '<td>' + esc(o.ref) + '</td>'
        + '<td>' + esc(o.date) + '</td>'
        + '<td>' + esc(o.total) + '</td>'
        + '<td class="carrier">' + esc(o.carrier || 'Mondial relay') + '</td>'
        + '<td class="status"><span class="badge">' + esc(o.status || 'Paid') + '</span></td>'
        + '</tr>';
    }).join('');
  }
</script>
</body>
</html>
